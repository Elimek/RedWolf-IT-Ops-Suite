server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php product.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Logging
    access_log /var/log/nginx/redwolf_access.log;
    error_log /var/log/nginx/redwolf_error.log;

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Block sensitive files
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # Magento Lite
    location /magento_lite/ {
        try_files $uri $uri/ /magento_lite/product.php?$query_string;
    }

    # Monitoring
    location /monitoring/ {
        try_files $uri $uri/ /monitoring/dashboard.php?$query_string;
    }

    # AI Agent
    location /ai_agent/ {
        try_files $uri $uri/ /ai_agent/classifier.html?$query_string;
    }

    # Office Tools
    location /office_tools/ {
        try_files $uri $uri/ /office_tools/index.php?$query_string;
    }
}
